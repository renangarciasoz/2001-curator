---
# Overlay de desenvolvimento. Publica as portas no host porque a aplicação Next.js
# roda fora do Compose (`pnpm dev`) e precisa alcançar Postgres e Qdrant.
# Invocação sempre explícita: docker compose -f compose.yaml -f compose.dev.yaml up -d

services:
  postgres:
    container_name: epcvip-indicador-2001-postgres
    hostname: epcvip-indicador-2001-postgres.local
    env_file: .env
    ports:
      - ${POSTGRES_PORT:-5432}:5432

  qdrant:
    container_name: epcvip-indicador-2001-qdrant
    hostname: epcvip-indicador-2001-qdrant.local
    env_file: .env
    ports:
      - ${QDRANT_HTTP_PORT:-6333}:6333
