---
name: indicador-2001

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-indicador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indicador}
      POSTGRES_DB: ${POSTGRES_DB:-indicador_2001}
    volumes:
      # Postgres 18+ stores data under a major-version subdirectory and expects
      # a single mount at /var/lib/postgresql. Mounting the old
      # /var/lib/postgresql/data path makes the image refuse to start, reading
      # the mount as a stale pre-18 cluster.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-indicador} -d ${POSTGRES_DB:-indicador_2001}
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - indicador-2001

  qdrant:
    # Keep this minor in step with `@qdrant/js-client-rest` in package.json:
    # the client refuses a major mismatch and warns past one minor of drift.
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - indicador-2001

volumes:
  postgres-data:
    name: indicador-2001-postgres-data
  qdrant-data:
    name: indicador-2001-qdrant-data

networks:
  indicador-2001:
    name: indicador-2001
