---
name: indicador-2001

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-indicador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-indicador}
      POSTGRES_DB: ${POSTGRES_DB:-indicador_2001}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-indicador} -d ${POSTGRES_DB:-indicador_2001}
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - indicador-2001

  qdrant:
    image: qdrant/qdrant:v1.16.1
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - indicador-2001

volumes:
  postgres-data:
    name: indicador-2001-postgres-data
  qdrant-data:
    name: indicador-2001-qdrant-data

networks:
  indicador-2001:
    name: indicador-2001
