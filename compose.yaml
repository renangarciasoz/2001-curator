---
name: 2001-curator

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curator}
      # Not `2001-curator`: a Postgres identifier cannot start with a digit or
      # contain a hyphen without quoting every reference to it forever.
      POSTGRES_DB: ${POSTGRES_DB:-curator_2001}
    volumes:
      # Postgres 18+ stores data under a major-version subdirectory and expects
      # a single mount at /var/lib/postgresql. Mounting the old
      # /var/lib/postgresql/data path makes the image refuse to start, reading
      # the mount as a stale pre-18 cluster.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-curator} -d ${POSTGRES_DB:-curator_2001}
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - curator

  qdrant:
    # Keep this minor in step with `@qdrant/js-client-rest` in package.json:
    # the client refuses a major mismatch and warns past one minor of drift.
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - curator

volumes:
  postgres-data:
    name: 2001-curator-postgres-data
  qdrant-data:
    name: 2001-curator-qdrant-data

networks:
  curator:
    name: 2001-curator
